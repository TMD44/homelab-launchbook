name: Validate Secrets

on:
  pull_request:
    branches:
      - master

  push:
    branches:
      - master

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-secrets-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan-secrets:
    name: Validate Git History for Secrets
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      # v8.30.1 is intentionally avoided because its release binary has a
      # documented detection regression. The runtime canary test below also
      # prevents a silently non-functional scanner from passing.
      GITLEAKS_VERSION: "8.30.0"
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Check out full Git history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install and verify Gitleaks
        shell: bash
        run: |
          set -euo pipefail

          install_directory="$RUNNER_TEMP/validate-secrets-bin"
          download_directory="$RUNNER_TEMP/gitleaks-download"
          archive_name="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          checksum_name="gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          archive_path="${download_directory}/${archive_name}"
          checksum_path="${download_directory}/${checksum_name}"

          mkdir -p "$install_directory" "$download_directory"

          gh release download "v${GITLEAKS_VERSION}" \
            --repo gitleaks/gitleaks \
            --pattern "$archive_name" \
            --pattern "$checksum_name" \
            --dir "$download_directory"

          expected_checksum="$(
            awk -v filename="$archive_name" \
              '$2 == filename { print $1 }' \
              "$checksum_path"
          )"

          if [[ ! "$expected_checksum" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::The official Gitleaks checksum file did not contain a valid checksum for ${archive_name}."
            exit 1
          fi

          echo "${expected_checksum}  ${archive_path}" |
            sha256sum --check

          api_digest="$(
            gh api \
              "repos/gitleaks/gitleaks/releases/tags/v${GITLEAKS_VERSION}" \
              --jq ".assets[] | select(.name == \"${archive_name}\") | .digest"
          )"
          local_digest="sha256:$(sha256sum "$archive_path" | awk '{ print $1 }')"

          if [[ "$api_digest" != "$local_digest" ]]; then
            echo "::error::The downloaded Gitleaks archive does not match the GitHub Release API digest."
            exit 1
          fi

          tar -xzf "$archive_path" -C "$download_directory"
          install -m 0755 \
            "${download_directory}/gitleaks" \
            "${install_directory}/gitleaks"

          echo "$install_directory" >> "$GITHUB_PATH"

      - name: Verify Gitleaks version
        shell: bash
        run: |
          set -euo pipefail

          installed_version="$(gitleaks version)"
          installed_version="${installed_version#v}"

          if [[ "$installed_version" != "$GITLEAKS_VERSION" ]]; then
            echo "::error::Expected Gitleaks ${GITLEAKS_VERSION}, but found ${installed_version}."
            exit 1
          fi

          echo "Using Gitleaks ${installed_version}."

      - name: Verify scanner with canary
        shell: bash
        run: |
          set -euo pipefail

          canary_directory="$RUNNER_TEMP/gitleaks-canary"
          canary_report="${canary_directory}/report.json"
          mkdir -p "$canary_directory"

          first_half="cafebabe"
          second_half="deadbeef"

          set +e
          printf \
            'export BUNDLE_ENTERPRISE__CONTRIBSYS__COM=%s:%s\n' \
            "$first_half" \
            "$second_half" |
            gitleaks stdin \
              --config ".github/actions/validate-secrets/gitleaks.toml" \
              --gitleaks-ignore-path \
              ".github/actions/validate-secrets/.gitleaksignore" \
              --redact=100 \
              --report-format json \
              --report-path "$canary_report" \
              --no-banner \
              --no-color \
              --log-level error
          canary_exit_code="$?"
          set -e

          finding_count="$(
            python - "$canary_report" <<'PY'
          import json
          import sys
          from pathlib import Path

          report_path = Path(sys.argv[1])
          if not report_path.is_file():
              print(0)
              raise SystemExit

          try:
              report = json.loads(report_path.read_text(encoding="utf-8"))
          except (OSError, json.JSONDecodeError):
              print(0)
              raise SystemExit

          print(len(report) if isinstance(report, list) else 0)
          PY
          )"

          rm -rf "$canary_directory"

          if [[ "$canary_exit_code" != "1" || "$finding_count" -lt 1 ]]; then
            echo "::error::Gitleaks failed its canary detection test."
            exit 1
          fi

          echo "Gitleaks successfully detected the runtime canary."

      - name: Scan full Git history
        id: secret-scan
        shell: bash
        run: |
          set -euo pipefail

          raw_report="$RUNNER_TEMP/gitleaks-raw-report.json"
          rm -f "$raw_report"

          set +e
          gitleaks git \
            --config ".github/actions/validate-secrets/gitleaks.toml" \
            --gitleaks-ignore-path \
            ".github/actions/validate-secrets/.gitleaksignore" \
            --log-opts="--all" \
            --redact=100 \
            --report-format json \
            --report-path "$raw_report" \
            --timeout 600 \
            --no-banner \
            --no-color \
            --log-level warn \
            .
          scan_exit_code="$?"
          set -e

          echo "exit-code=${scan_exit_code}" >> "$GITHUB_OUTPUT"

      - name: Create redacted secret-scan report
        id: secret-report
        if: always() && steps.secret-scan.outputs.exit-code != ''
        shell: bash
        env:
          SCAN_EXIT_CODE: ${{ steps.secret-scan.outputs.exit-code }}
        run: |
          python \
            ".github/actions/validate-secrets/render-gitleaks-report.py" \
            --input "$RUNNER_TEMP/gitleaks-raw-report.json" \
            --markdown-output "secret-scan-report.md" \
            --json-output "secret-scan-report.json" \
            --scan-exit-code "$SCAN_EXIT_CODE" \
            --gitleaks-version "$GITLEAKS_VERSION"

      - name: Remove raw scan report
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/gitleaks-raw-report.json"

      - name: Upload redacted secret-scan report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: secret-scan-report
          path: |
            secret-scan-report.md
            secret-scan-report.json
          if-no-files-found: warn
          retention-days: 14

      - name: Enforce secret-scan result
        if: always()
        shell: bash
        env:
          REPORT_STATUS: ${{ steps.secret-report.outputs.status }}
          FINDING_COUNT: ${{ steps.secret-report.outputs.finding-count }}
        run: |
          set -euo pipefail

          case "$REPORT_STATUS" in
            clean)
              echo "No potential secrets were detected."
              ;;
            findings)
              echo "::error::Gitleaks detected ${FINDING_COUNT} potential secret(s)."
              exit 1
              ;;
            *)
              echo "::error::Secret scanning did not produce a valid result."
              exit 1
              ;;
          esac
