name: Validate GitHub Actions Workflows

on:
  pull_request:
    branches:
      - master

  push:
    branches:
      - master

  workflow_dispatch:

permissions:
  contents: read
  attestations: read

concurrency:
  group: validate-workflows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-workflows:
    name: Validate Workflow Syntax & Security
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      ACTIONLINT_VERSION: "1.7.12"
      ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
      SHELLCHECK_VERSION: "0.11.0"
      SHELLCHECK_SHA256: "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198"
      PYFLAKES_VERSION: "3.4.0"
      PYFLAKES_SHA256: "f742a7dbd0d9cb9ea41e9a24a918996e8170c799fa528688d40dd582c8265f4f"
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install and verify actionlint
        shell: bash
        run: |
          set -euo pipefail

          install_directory="$RUNNER_TEMP/validate-workflows-bin"
          download_directory="$RUNNER_TEMP/actionlint-download"
          archive_name="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          archive_path="${download_directory}/${archive_name}"

          mkdir -p "$install_directory" "$download_directory"

          gh release download "v${ACTIONLINT_VERSION}" \
            --repo rhysd/actionlint \
            --pattern "$archive_name" \
            --dir "$download_directory"

          echo "${ACTIONLINT_SHA256}  ${archive_path}" | sha256sum --check
          gh attestation verify "$archive_path" --repo rhysd/actionlint

          tar -xzf "$archive_path" -C "$download_directory"
          install -m 0755 \
            "${download_directory}/actionlint" \
            "${install_directory}/actionlint"

          echo "$install_directory" >> "$GITHUB_PATH"

      - name: Install and verify ShellCheck
        shell: bash
        run: |
          set -euo pipefail

          install_directory="$RUNNER_TEMP/validate-workflows-bin"
          download_directory="$RUNNER_TEMP/shellcheck-download"
          archive_name="shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          archive_path="${download_directory}/${archive_name}"
          download_url="https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/${archive_name}"

          mkdir -p "$install_directory" "$download_directory"

          curl \
            --fail \
            --location \
            --retry 3 \
            --retry-all-errors \
            --show-error \
            --silent \
            "$download_url" \
            --output "$archive_path"

          echo "${SHELLCHECK_SHA256}  ${archive_path}" | sha256sum --check

          tar -xJf "$archive_path" -C "$download_directory"
          install -m 0755 \
            "${download_directory}/shellcheck-v${SHELLCHECK_VERSION}/shellcheck" \
            "${install_directory}/shellcheck"

      - name: Install and verify Pyflakes
        shell: bash
        run: |
          set -euo pipefail

          download_directory="$RUNNER_TEMP/pyflakes-download"
          wheel_name="pyflakes-${PYFLAKES_VERSION}-py2.py3-none-any.whl"
          wheel_path="${download_directory}/${wheel_name}"

          mkdir -p "$download_directory"

          python -m pip download \
            --disable-pip-version-check \
            --no-deps \
            --only-binary=:all: \
            "pyflakes==${PYFLAKES_VERSION}" \
            --dest "$download_directory"

          echo "${PYFLAKES_SHA256}  ${wheel_path}" | sha256sum --check

          python -m pip install \
            --disable-pip-version-check \
            --no-deps \
            "$wheel_path"

      - name: Verify tool versions
        shell: bash
        run: |
          set -euo pipefail

          installed_actionlint_version="$(
            actionlint -version |
              sed -n '1p'
          )"
          installed_shellcheck_version="$(
            shellcheck --version |
              awk '$1 == "version:" { print $2 }'
          )"
          installed_pyflakes_version="$(
            pyflakes --version |
              awk '{ print $1 }'
          )"

          if [[ "$installed_actionlint_version" != "$ACTIONLINT_VERSION" ]]; then
            echo "::error::Expected actionlint ${ACTIONLINT_VERSION}, but found ${installed_actionlint_version}."
            exit 1
          fi

          if [[ "$installed_shellcheck_version" != "$SHELLCHECK_VERSION" ]]; then
            echo "::error::Expected ShellCheck ${SHELLCHECK_VERSION}, but found ${installed_shellcheck_version}."
            exit 1
          fi

          if [[ "$installed_pyflakes_version" != "$PYFLAKES_VERSION" ]]; then
            echo "::error::Expected Pyflakes ${PYFLAKES_VERSION}, but found ${installed_pyflakes_version}."
            exit 1
          fi

          {
            echo "actionlint ${installed_actionlint_version}"
            echo "ShellCheck ${installed_shellcheck_version}"
            echo "Pyflakes ${installed_pyflakes_version}"
          }

      - name: Prepare actionlint configuration
        shell: bash
        run: |
          set -euo pipefail

          if [[ -e ".github/actionlint.yaml" || -e ".github/actionlint.yml" ]]; then
            echo "::error::A root actionlint configuration already exists. Keep the canonical configuration at .github/actions/validate-workflows/actionlint.yaml."
            exit 1
          fi

          install -m 0644 \
            ".github/actions/validate-workflows/actionlint.yaml" \
            ".github/actionlint.yaml"

      - name: Lint GitHub workflows
        id: workflow-lint
        shell: bash
        run: |
          set -euo pipefail

          result_file="workflow-lint-results.jsonl"
          stderr_file="workflow-lint-diagnostics.log"

          : > "$result_file"
          : > "$stderr_file"

          set +e
          actionlint \
            -shellcheck="$(command -v shellcheck)" \
            -pyflakes="$(command -v pyflakes)" \
            -format "{{range \$err := .}}{{json \$err}}{{end}}" \
            > "$result_file" \
            2> "$stderr_file"
          exit_code="$?"
          set -e

          echo "exit-code=${exit_code}" >> "$GITHUB_OUTPUT"

      - name: Check GitHub Actions security
        id: workflow-security
        uses: zizmorcore/zizmor-action@3dc1ecc9bcb9e94e9b2c709687979e1298497054 # v0.6.2
        with:
          version: "1.29.0"
          advanced-security: false
          annotations: true

      - name: Create workflow-lint report
        if: always()
        shell: bash
        env:
          ZIZMOR_OUTCOME: ${{ steps.workflow-security.outcome }}
        run: |
          set -euo pipefail

          result_file="workflow-lint-results.jsonl"
          stderr_file="workflow-lint-diagnostics.log"
          report_file="workflow-lint-report.md"

          touch "$result_file" "$stderr_file"

          issue_count="$(
            jq --slurp 'length' "$result_file"
          )"

          {
            echo "## GitHub workflow linting"
            echo
            echo "- **actionlint:** \`${ACTIONLINT_VERSION}\`"
            echo "- **ShellCheck:** \`${SHELLCHECK_VERSION}\`"
            echo "- **Pyflakes:** \`${PYFLAKES_VERSION}\`"
            echo "- **Workflow lint issues:** ${issue_count}"
            echo "- **zizmor security audit:** ${ZIZMOR_OUTCOME}"
            echo
          } > "$report_file"

          if (( issue_count == 0 )); then
            echo "✅ No workflow linting issues were detected." >> "$report_file"
          else
            echo "❌ Workflow linting issues were detected." >> "$report_file"
            echo >> "$report_file"

            while IFS= read -r issue; do
              [[ -n "$issue" ]] || continue

              filepath="$(jq --raw-output '.filepath' <<< "$issue")"
              line="$(jq --raw-output '.line' <<< "$issue")"
              column="$(jq --raw-output '.column' <<< "$issue")"
              kind="$(jq --raw-output '.kind' <<< "$issue")"
              message="$(jq --raw-output '.message' <<< "$issue")"
              snippet="$(jq --raw-output '.snippet' <<< "$issue")"

              annotation_message="${message//'%'/'%25'}"
              annotation_message="${annotation_message//$'\r'/'%0D'}"
              annotation_message="${annotation_message//$'\n'/'%0A'}"

              printf \
                '::error file=%s,line=%s,col=%s,title=actionlint (%s)::%s\n' \
                "$filepath" \
                "$line" \
                "$column" \
                "$kind" \
                "$annotation_message"

              {
                echo "### \`${filepath}:${line}:${column}\`"
                echo
                echo "**Rule:** \`${kind}\`"
                echo
                printf '%s\n' "$message"
                echo
                echo '```text'
                printf '%s\n' "$snippet"
                echo '```'
                echo
              } >> "$report_file"
            done < "$result_file"
          fi

          if [[ "$ZIZMOR_OUTCOME" == "success" ]]; then
            {
              echo
              echo "✅ No GitHub Actions security issues were detected by zizmor."
            } >> "$report_file"
          else
            {
              echo
              echo "❌ The zizmor security audit did not pass. Review the workflow annotations for security findings."
            } >> "$report_file"
          fi

          if [[ -s "$stderr_file" ]]; then
            {
              echo
              echo "### actionlint diagnostic output"
              echo
              echo '```text'
              cat "$stderr_file"
              echo '```'
            } >> "$report_file"
          fi

          cat "$report_file" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload workflow-lint report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: workflow-lint-report
          path: |
            workflow-lint-report.md
            workflow-lint-results.jsonl
            workflow-lint-diagnostics.log
          if-no-files-found: warn
          retention-days: 14

      - name: Enforce workflow-lint result
        if: always() && steps.workflow-lint.outcome != 'skipped'
        shell: bash
        env:
          ACTIONLINT_EXIT_CODE: ${{ steps.workflow-lint.outputs.exit-code }}
        run: |
          set -euo pipefail

          if [[ -z "$ACTIONLINT_EXIT_CODE" ]]; then
            echo "::error::actionlint did not return an exit code."
            exit 1
          fi

          if [[ "$ACTIONLINT_EXIT_CODE" != "0" ]]; then
            echo "::error::GitHub Actions workflow linting failed."
            exit 1
          fi

          echo "All GitHub Actions workflow files passed actionlint validation."
