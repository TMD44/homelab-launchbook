name: Validate Docker Compose

on:
  pull_request:
    branches:
      - master

  push:
    branches:
      - master

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-compose-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-compose:
    name: Validate Compose & Env Configurations
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Set up Docker Compose
        uses: docker/setup-compose-action@4eb059ff7f16592f9c84d5ca339c53cb7c5064e2 # v2.3.0
        with:
          version: "v5.4.0"
          cache-binary: true

      - name: Verify Docker Compose version
        shell: bash
        run: |
          compose_version="$(docker compose version --short)"
          compose_version="${compose_version#v}"

          if [[ "$compose_version" != "5.4.0" ]]; then
            echo "::error::Expected Docker Compose 5.4.0, but found ${compose_version}."
            exit 1
          fi

          echo "Using Docker Compose ${compose_version}."

      - name: Validate Compose files
        run: >-
          python
          .github/actions/validate-compose/validate-compose.py
          --allow-empty
          --report compose-validation-report.md

      - name: Upload Compose report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: compose-validation-report
          path: compose-validation-report.md
          if-no-files-found: warn
          retention-days: 14
