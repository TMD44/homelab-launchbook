# ===============================================
# - File: adguardhome-compose.yaml
# - Last modified: 2026.08.31.
# - Summary: DNS filtering (DNS + Web UI; DHCP/DoH/DoT ports currently disabled)
# - Configuration files: /ADGUARDHOME/conf/AdGuardHome.yaml (generated by AdGuard Home inside the volume)
# ===============================================
services:
  adguard-home:
    container_name: adguard_home_dns1
    image: "adguard/adguardhome:${VERSION}"
    restart: always
    security_opt:
      - no-new-privileges:true
    ports:
      - "53:53/tcp"      # Standard DNS
      - "53:53/udp"      # Standard DNS
      - "3000:3000/tcp"  # Web interface
      - "80:80/tcp"
      #- "784:784/udp"   # DNS-over-QUIC
      #- "853:853/tcp"   # DNS over TLS (DoT)
      #- "443:443/tcp"
    environment:
      TZ: "${TIMEZONE}"
    volumes:
      - /ADGUARDHOME/work:/opt/adguardhome/work
      - /ADGUARDHOME/conf:/opt/adguardhome/conf
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- --timeout=2 http://127.0.0.1:3000/ >/dev/null 2>&1 && grep -qE ':0035 .* 0A ' /proc/net/tcp* && grep -q ':0035' /proc/net/udp*"]
      start_period: 20s
      interval: 30s
      timeout: 3s
      retries: 3
