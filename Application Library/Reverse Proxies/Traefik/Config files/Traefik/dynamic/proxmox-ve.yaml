http:
  routers:
    pve1:
      entryPoints:
        - websecure
      rule: Host(`pve1.<MY-DOMAIN>.com`) || Host(`proxmox.<MY-DOMAIN>.com`)
      middlewares:
        - secured@file
      service: pve1

  services:
    pve1:
      loadBalancer:
        passHostHeader: true
        serversTransport: skipverify@file
        servers:
          - url: https://192.168.0.11:8006
