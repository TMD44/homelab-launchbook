# ===============================================
# - File: homepage-compose.yaml
# - Last modified: 2026.09.02.
# - Summary: Homepage dashboard
# - Configuration files: /config/*.yaml (services.yaml, settings.yaml, widgets.yaml, bookmarks.yaml)
# - Notes:
#   - Restart the Homepage container after editing YAML config to ensure changes apply.
#   - The reference route is private and does not place Authelia in front of Homepage.
# ===============================================
services:
  homepage:
    container_name: homepage
    image: ghcr.io/gethomepage/homepage:latest # Non-critical service; "latest" is acceptable to simplify updates.
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "3000:3000"
    environment:
      HOMEPAGE_ALLOWED_HOSTS: "<MY-DOMAIN>.com,homepage.<MY-DOMAIN>.com,<HOMEPAGE-IP>:3000"
      TZ: Europe/Budapest
    volumes:
      - /HOMEPAGE/config:/app/config
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - homepage-net

networks:
  homepage-net:
    name: homepage-net
